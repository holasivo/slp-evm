name: SLP EVM CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 24
  NODE_ENV: ci
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  ci:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Build (hardhat compile + tsc)
        run: npm run build
      - name: Test
        run: npm run test:ci
